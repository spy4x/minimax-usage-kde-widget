# Disable warnings that fire purely because qmllint can't resolve Plasma/
# Kirigami modules without the runtime import paths. Real syntax errors
# and type errors still fire.
[Warnings]
UnqualifiedAccess=disable
UnqualifiedAttachedPropertyReuse=disable
ImportFailure=info
AttachedPropertyReuse=info
InheritanceCritique=info
ComponentNonRootBegin=info
PropertyAliasCausesLoop=info
Deprecated=info
WithStatement=error
SignalParametersShape=info
UnusedImports=info
TypeNamesWarning=info
ConflictingTypes=info
QmlUnusedImports=info
